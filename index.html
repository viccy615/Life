const MO=['Morning','Morning & Evening'],EV=['Evening','Morning & Evening'],WH=['Morning','Evening','Morning & Evening','After Salah','Before Sleep','Anytime'],DD0=[[`Dua for Stress & Worry`,`حَسْبِيَ اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ ۖ عَلَيْهِ تَوَكَّلْتُ ۖ وَهُوَ رَبُّ الْعَرْشِ الْعَظِيمِ`,`Hasbiyallahu la ilaha illa Huwa, ’alayhi tawakkaltu, wa Huwa Rabbul-’Arshil-’Azim.`,`Allah is sufficient for me. There is no god but Him. In Him I put my trust, and He is the Lord of the Mighty Throne.`,`Morning & Evening`],[`Dua for Allah’s Mercy & Forgiveness`,`اللَّهُمَّ إِنَّكَ عَفُوٌّ تُحِبُّ الْعَفْوَ فَاعْفُ عَنِّي`,`Allahumma innaka ’afuwwun tuhibbul-‘afwa fa’fu ’anni.`,`O Allah, You are Pardoning and You love to pardon, so pardon me.`,`Anytime`],[`Dua for Barakah & Provision`,`رَبِّ إِنِّي لِمَا أَنزَلْتَ إِلَيَّ مِنْ خَيْرٍ فَقِيرٌ`,`Rabbi inni lima anzalta ilayya min khayrin faqir.`,`My Lord, I am truly in need of whatever good You send down to me.`,`Anytime`],[`Dua for Protection from Hellfire`,`اللَّهُمَّ أَجِرْنِي مِنَ النَّارِ`,`Allahumma ajirni min an-nar.`,`O Allah, protect me from the Fire.`,`Morning & Evening`],[`Dua for Ease in Worship`,`اللَّهُمَّ أَعِنِّي عَلَى ذِكْرِكَ وَشُكْرِكَ وَحُسْنِ عِبَادَتِكَ`,`Allahumma a’inni ’ala dhikrika wa shukrika wa husni ’ibadatik.`,`O Allah, help me to remember You, to thank You, and to worship You in the best manner.`,`After Salah`],[`Dua for a Blessed Ending`,`اللَّهُمَّ اجْعَلْ خَيْرَ عُمُرِي آخِرَهُ، وَخَيْرَ عَمَلِي خَوَاتِمَهُ، وَخَيْرَ أَيَّامِي يَوْمَ أَلْقَاكَ`,`Allahummaj’al khayra ’umuri akhirahu, wa khayra ’amali khawatimahu, wa khayra ayyami yawma alqak.`,`O Allah, make the best part of my life its end, the best of my deeds their conclusion, and the best of my days the day I meet You.`,`Anytime`],[`Dua for Good in This Life & the Hereafter`,`رَبَّنَا آتِنَا فِي الدُّنْيَا حَسَنَةً وَفِي الْآخِرَةِ حَسَنَةً وَقِنَا عَذَابَ النَّارِ`,`Rabbana atina fid-dunya hasanatan wa fil-akhirati hasanatan wa qina ’adhaban-nar.`,`Our Lord, give us good in this world and good in the Hereafter, and protect us from the punishment of the Fire.`,`Anytime`],[`Dua for Guidance`,`اهْدِنَا الصِّرَاطَ الْمُسْتَقِيمَ`,`Ihdinas-siratal-mustaqim.`,`Guide us to the straight path.`,`Anytime`],[`Dua for a Steadfast Heart`,`يَا مُقَلِّبَ الْقُلُوبِ ثَبِّتْ قَلْبِي عَلَى دِينِكَ`,`Ya Muqallibal-qulub, thabbit qalbi ’ala dinik.`,`O Turner of hearts, keep my heart firm on Your religion.`,`Morning & Evening`],[`Dua for Forgiveness & Repentance`,`أَسْتَغْفِرُ اللَّهَ وَأَتُوبُ إِلَيْهِ`,`Astaghfirullaha wa atubu ilayh.`,`I seek forgiveness from Allah and I repent to Him.`,`Anytime`],[`Dua of Prophet Yunus – Distress & Hardship`,`لَا إِلَٰهَ إِلَّا أَنتَ سُبْحَانَكَ إِنِّي كُنتُ مِنَ الظَّالِمِينَ`,`La ilaha illa Anta, subhanaka inni kuntu minaz-zalimin.`,`There is no god but You. Glory be to You! Truly, I have been one of the wrongdoers.`,`Anytime`],[`Last Two Ayat of Surah Al-Baqarah (285–286)`,`آمَنَ الرَّسُولُ بِمَا أُنزِلَ إِلَيْهِ مِن رَّبِّهِ وَالْمُؤْمِنُونَ ۚ كُلٌّ آمَنَ بِاللَّهِ وَمَلَائِكَتِهِ وَكُتُبِهِ وَرُسُلِهِ لَا نُفَرِّقُ بَيْنَ أَحَدٍ مِّن رُّسُلِهِ ۚ وَقَالُوا سَمِعْنَا وَأَطَعْنَا ۖ غُفْرَانَكَ رَبَّنَا وَإِلَيْكَ الْمَصِيرُ ۝ لَا يُكَلِّفُ اللَّهُ نَفْسًا إِلَّا وُسْعَهَا ۚ لَهَا مَا كَسَبَتْ وَعَلَيْهَا مَا اكْتَسَبَتْ ۗ رَبَّنَا لَا تُؤَاخِذْنَا إِن نَّسِينَا أَوْ أَخْطَأْنَا ۚ رَبَّنَا وَلَا تَحْمِلْ عَلَيْنَا إِصْرًا كَمَا حَمَلْتَهُ عَلَى الَّذِينَ مِن قَبْلِنَا ۚ رَبَّنَا وَلَا تُحَمِّلْنَا مَا لَا طَاقَةَ لَنَا بِهِ ۖ وَاعْفُ عَنَّا وَاغْفِرْ لَنَا وَارْحَمْنَا ۚ أَنتَ مَوْلَانَا فَانصُرْنَا عَلَى الْقَوْمِ الْكَافِرِينَ`,`Ayah 285: Amanar-Rasulu bima unzila ilayhi mir-Rabbihi wal-mu’minun. Kullun amana billahi wa mala’ikatihi wa kutubihi wa rusulihi, la nufarriqu bayna ahadim mir-rusulih. Wa qalu sami’na wa ata’na, ghufranaka Rabbana wa ilaykal-masir.

Ayah 286: La yukallifullahu nafsan illa wus’aha. Laha ma kasabat wa ‘alayha maktasabat. Rabbana la tu’akhidhna in nasina aw akhta’na. Rabbana wa la tahmil ’alayna isran kama hamaltahu ‘alal-ladhina min qablina. Rabbana wa la tuhammilna ma la taqata lana bih. Wa’fu ’anna, waghfir lana, warhamna. Anta Mawlana fansurna ’alal-qawmil-kafirin.`,`285: The Messenger believes in what was revealed to him from his Lord, and so do the believers. All of them believe in Allah, His angels, His Books and His Messengers. “We make no distinction between any of His Messengers.” They say, “We hear and we obey. Your forgiveness, our Lord, and to You is the final return.”

286: Allah does not burden a soul beyond its capacity. It will have what it has earned and bear what it has earned. “Our Lord, do not take us to task if we forget or make a mistake. Our Lord, do not place on us a burden like the one You placed on those before us. Our Lord, do not burden us with more than we can bear. Pardon us, forgive us and have mercy on us. You are our Protector, so help us against the disbelievers.”`,`Before Sleep`]],
